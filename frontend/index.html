<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SEO Analyzer</title>
		<link rel="stylesheet" href="./css/styles.css" />
	</head>
	<body>
		<main class="container">
			<h1>SEO Analyzer</h1>

				<form class="panel" method="post" action="/seo/form">
					<label for="query" class="label">Enter your query</label>
					<textarea name="query" id="query" class="input" rows="6" placeholder="Type a product, topic, or phrase to analyze..." required></textarea>
					<div class="actions">
						<button type="submit" class="btn primary">Analyze</button>
					</div>
				</form>
		</main>
	</body>
	</html>
